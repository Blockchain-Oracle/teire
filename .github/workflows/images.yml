name: Images

# The worker and web images, built here and pulled by the Coolify host, so heavy builds never run
# beside the other services on that machine. Tags: the branch name and the commit.

on:
  push:
    branches: [otari]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [worker, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          build-args: |
            TEIRE_PUBLIC_URL=${{ vars.TEIRE_PUBLIC_URL || 'https://teire.84.46.247.92.sslip.io' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/blockchain-oracle/teire-${{ matrix.app }}:${{ github.ref_name }}
            ghcr.io/blockchain-oracle/teire-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
